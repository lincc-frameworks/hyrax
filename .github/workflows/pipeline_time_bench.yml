# This workflow will setup the environment and run the full pipeline benchmarking test.
name: Runtime Benchmark

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout main branch of the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create fresh virtual environment
        run: |
          # clean up venv
          rm -rf .venv
          uv venv .venv --python 3.12

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -e ".[dev]"
          if [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -r requirements.txt; fi

      - name: Run benchmark
        id: benchmark
        run: |
          source .venv/bin/activate

          # path to downloaded cifar dataset
          # currently gondor-specific path, should be changed for other environments
          export CIFAR_DIR="/astro/store/shiren/wqy37/datasets"
          # path to the HSC1k cutouts (downloaded on first use)
          export HSC_DIR="/astro/store/shiren/wqy37/datasets"

          # path for saving the result
          # currently gondor-specific path, should be changed for other environments
          export RESULT_PATH="/astro/store/shiren/wqy37/results"

          # run_timebench.py prints one RESULT_FILE=<path> line per benchmark it runs
          # (CIFAR-10 CNN and HSC1k autoencoder; see benchmarks_self_hosted/README.md)
          OUTPUT=$(python benchmarks_self_hosted/run_timebench.py --benchmark all)
          RESULT_FILES=$(echo "$OUTPUT" | grep '^RESULT_FILE=' | cut -d= -f2-)
          {
            echo "result_files<<EOF"
            echo "$RESULT_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout benchmarks branch
        run: |
          if git ls-remote --exit-code origin benchmarks >/dev/null 2>&1; then
            git fetch origin benchmarks:refs/remotes/origin/benchmarks
            git checkout -B benchmarks origin/benchmarks
          fi

      - name: Publish benchmark results to benchmarks branch
        run: |
          mkdir -p gondor_results
          echo "${{ steps.benchmark.outputs.result_files }}" | while read -r RESULT_FILE; do
            [ -n "$RESULT_FILE" ] && cp "$RESULT_FILE" gondor_results/
          done

          # check if copied any files
          if [ -z "$(find gondor_results -maxdepth 1 -type f -name '*.json' 2>/dev/null)" ]; then
            echo "No benchmark result JSON files were found to publish."
            exit 0
          fi

          git add gondor_results
          if git diff --cached --quiet; then
            echo "No new benchmark results to publish."
            exit 0
          fi

          git commit -m "Add custom benchmark results"
          git push origin benchmarks
